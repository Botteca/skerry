<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Settings · Skerry</title>
<style>
  :root{--bg:#0e0e10;--side:#131316;--panel:#1a1a1e;--panel2:#212126;--line:#2b2b31;--fg:#f4f4f6;--muted:#8d8d95;--accent:#d97757;--green:#30d158;--red:#ff453a;--amber:#ff9f0a;--ease:cubic-bezier(.22,1,.36,1)}
  :root[data-theme=light]{--bg:#f3f3f6;--side:#eaeaef;--panel:#fff;--panel2:#f0f0f4;--line:#e0e0e6;--fg:#1c1c1e;--muted:#6c6c74}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font:13.5px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;-webkit-font-smoothing:antialiased}
  /* ---------- sidebar ---------- */
  aside{width:208px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 14px}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
  .logo{width:46px;height:20px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;box-shadow:0 0 0 1px var(--line);flex:none}
  .logo i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:background .3s,box-shadow .3s}
  .brand b{font-size:16px;font-weight:650;display:block;line-height:1.1} .brand span{font-size:11px;color:var(--muted)}
  nav{display:flex;flex-direction:column;gap:2px;flex:1}
  nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s}
  nav button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  nav button:hover{background:var(--panel2);color:var(--fg)}
  nav button.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
  nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  nav button.on svg{color:var(--accent)}
  .upd-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .foot{font-size:11px;color:var(--muted);padding:10px 10px 0}
  /* ---------- content ---------- */
  main{flex:1;min-width:0;overflow-y:auto;padding:26px 34px 40px;scroll-behavior:smooth}
  main::-webkit-scrollbar{width:10px} main::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--bg)}
  .page{display:none;max-width:640px;animation:in .38s var(--ease) both} .page.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:22px;font-weight:650;letter-spacing:-.2px} .sub{color:var(--muted);margin:2px 0 18px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
  .panel{background:var(--panel);border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px;transition:background .15s}
  .row:first-child{border-top:0} .row:hover{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  .row .l{flex:1;min-width:0;font-weight:500} .row .d{color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
  .ico{width:32px;height:32px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:15px}
  .sw{position:relative;width:42px;height:25px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .sw span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .25s var(--ease)}
  .sw span:before{content:"";position:absolute;width:21px;height:21px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .3s var(--ease),width .2s;box-shadow:0 1px 3px #0006}
  .sw:active span:before{width:25px} .sw input:checked+span{background:var(--accent)}
  .sw input:checked+span:before{transform:translateX(17px)} .sw input:checked:active+span:before{transform:translateX(13px)}
  .sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  select,input[type=text],input[type=number]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;outline:0;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  input[type=number]{width:84px;text-align:right} input[type=text]{width:190px} input.wide{width:100%}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:5px 13px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
  .seg button:hover{color:var(--fg)} .seg button.on{background:var(--accent);color:#fff;box-shadow:0 1px 4px #0004}
  .accents{display:flex;gap:10px;align-items:center}
  .accents i{width:24px;height:24px;border-radius:50%;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 0 0 2px var(--panel)}
  .accents i:hover{transform:scale(1.14)} .accents i.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 15px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
  .btn:hover{border-color:var(--muted)} .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.45;cursor:default}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:10px;background:var(--panel2);color:var(--muted);white-space:nowrap}
  .badge.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
  .badge.no{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
  .note{color:var(--muted);font-size:12px;padding:11px 16px 13px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--amber) 7%,transparent)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:12px Consolas,monospace}
  /* edge picker with preview */
  .edge{display:flex;gap:22px;align-items:center;padding:18px 16px}
  .screen{width:190px;height:118px;border-radius:9px;background:var(--panel2);border:2px solid var(--line);position:relative;flex:none;box-shadow:inset 0 0 30px #0003}
  .screen::after{content:"";position:absolute;left:50%;bottom:-9px;width:46px;height:7px;background:var(--line);border-radius:0 0 4px 4px;transform:translateX(-50%)}
  .pill{position:absolute;background:#000;border-radius:7px;box-shadow:0 0 0 1px var(--line);transition:all .45s var(--ease);display:flex;align-items:center;justify-content:center}
  .pill i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .screen[data-e=top] .pill{left:calc(var(--o)*100% - 22px);top:6px;width:44px;height:13px}
  .screen[data-e=bottom] .pill{left:calc(var(--o)*100% - 22px);top:calc(100% - 19px);width:44px;height:13px}
  .screen[data-e=left] .pill{top:calc(var(--o)*100% - 22px);left:6px;width:13px;height:44px}
  .screen[data-e=right] .pill{top:calc(var(--o)*100% - 22px);left:calc(100% - 19px);width:13px;height:44px}
  .edge .ctl{flex:1;display:flex;flex-direction:column;gap:12px}
  .hint{font-size:12px;color:var(--muted)}
  .msg{font-size:12px;color:var(--muted)}
  .about{display:flex;gap:16px;align-items:center;padding:22px 18px}
  .about .logo{width:78px;height:30px;border-radius:15px;padding-right:10px} .about .logo i{width:10px;height:10px}
  .about b{font-size:17px;display:block} .about span{color:var(--muted);font-size:12.5px}
  .soon .row{opacity:.62} .soon .row:hover{background:transparent}
  .guide{background:var(--panel2);line-height:1.55} .guide>b:first-child{display:block;color:var(--fg);margin-bottom:4px;font-size:12.5px}
  .guide ol{padding-left:18px} .guide li{margin:3px 0} .guide code{color:var(--fg);white-space:nowrap;word-break:normal}
  .badge.err{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
  input::placeholder{color:var(--muted);opacity:.55}
  code{font:12px Consolas,monospace;color:var(--muted);word-break:break-all}
  @media (max-width:760px){aside{width:64px;padding:16px 8px}.brand div,nav button span,.foot{display:none}.brand{padding:0 0 16px;justify-content:center}.logo{display:none}nav button{justify-content:center;padding:10px}nav button.on::before{left:-8px}}
  body:not(.ready){visibility:hidden}  /* until the first load() applies the language */
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo"><i></i></div><div><b>Skerry</b><span id="ver"></span></div></div>
  <nav id="nav">
    <button data-p="gen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="nav.general"></span></button>
    <button data-p="look"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 2 2 0 0 0 2-2c0-.6-.3-1-.5-1.4-.3-.4-.5-.8-.5-1.3a2 2 0 0 1 2-2h2.3A3.7 3.7 0 0 0 21 10.6C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r=".6"/><circle cx="10" cy="7" r=".6"/><circle cx="15" cy="7" r=".6"/></svg><span data-i18n="nav.look"></span></button>
    <button data-p="agents"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span data-i18n="nav.agents"></span></button>
    <button data-p="mods"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span data-i18n="nav.modules"></span></button>
    <button data-p="conn"><svg viewBox="0 0 24 24"><path d="M9 7V3m6 4V3M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/></svg><span data-i18n="nav.connections"></span></button>
    <button data-p="alerts"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span data-i18n="nav.alerts"></span></button>
    <button data-p="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span data-i18n="nav.pomodoro"></span></button>
    <button data-p="upd"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-i18n="nav.updates"></span><i class="upd-dot" id="upd-dot" hidden></i></button>
    <button data-p="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg><span data-i18n="nav.info"></span></button>
  </nav>
  <div class="foot" data-i18n="nav.autosave"></div>
</aside>

<main id="main">
<section class="page" id="p-gen">
  <h1 data-i18n="gen.title"></h1><div class="sub" data-i18n="gen.sub"></div>
  <div class="panel">
    <div class="row"><div class="ico">🌐</div><div class="l"><span data-i18n="gen.language"></span><div class="d" data-i18n="gen.languageDesc"></div></div><div class="seg" data-seg="language"><button data-v="auto" data-i18n="lang.auto"></button><button data-v="en" data-i18n="lang.en"></button><button data-v="it" data-i18n="lang.it"></button></div></div>
    <div class="row"><div class="ico">🧭</div><div class="l"><span data-i18n="gen.onboarding"></span><div class="d" data-i18n="gen.onboardingDesc"></div></div><button class="btn" id="onb-btn" data-i18n="gen.onboardingBtn"></button></div>
    <div class="row"><div class="ico">🚀</div><div class="l"><span data-i18n="gen.autostart"></span><div class="d" data-i18n="gen.autostartDesc"></div></div><label class="sw"><input type="checkbox" data-k="autostart"><span></span></label></div>
    <div class="row"><div class="ico">⌨️</div><div class="l"><span data-i18n="gen.hotkey"></span><div class="d" data-i18n-html="gen.hotkeyDescHtml"></div></div><input type="text" data-k="hotkey" data-lazy></div>
  </div>
  <h2 data-i18n="gen.privacy"></h2>
  <div class="panel">
    <div class="row"><div class="ico">🖥️</div><div class="l"><span data-i18n="gen.hideCapture"></span><div class="d" data-i18n="gen.hideCaptureDesc"></div></div><label class="sw"><input type="checkbox" data-k="hide_from_capture"><span></span></label></div>
    <div class="row"><div class="ico">🎬</div><div class="l"><span data-i18n="gen.hideFullscreen"></span><div class="d" data-i18n="gen.hideFullscreenDesc"></div></div><label class="sw"><input type="checkbox" data-k="hide_fullscreen"><span></span></label></div>
    <div class="row"><div class="ico">🔐</div><div class="l"><span data-i18n="gen.permOverFullscreen"></span><div class="d" data-i18n="gen.permOverFullscreenDesc"></div></div><label class="sw"><input type="checkbox" data-k="permission_over_fullscreen"><span></span></label></div>
  </div>
</section>

<section class="page" id="p-look">
  <h1 data-i18n="look.title"></h1><div class="sub" data-i18n="look.sub"></div>
  <div class="panel">
    <div class="edge">
      <div class="screen" id="screen" data-e="top" style="--o:.5"><div class="pill"><i></i></div></div>
      <div class="ctl">
        <div class="seg" data-seg="edge"><button data-v="top" data-i18n="look.top"></button><button data-v="bottom" data-i18n="look.bottom"></button><button data-v="left" data-i18n="look.left"></button><button data-v="right" data-i18n="look.right"></button></div>
        <div style="display:flex;gap:10px;align-items:center"><button class="btn" id="center" data-i18n="look.center"></button><span class="hint" data-i18n="look.dragHint"></span></div>
      </div>
    </div>
  </div>
  <h2 data-i18n="look.themeSection"></h2>
  <div class="panel">
    <div class="row"><div class="l" data-i18n="look.theme"></div><div class="seg" data-seg="theme"><button data-v="dark" data-i18n="look.dark"></button><button data-v="light" data-i18n="look.light"></button></div></div>
    <div class="row"><div class="l"><span data-i18n="look.accent"></span><div class="d" data-i18n="look.accentDesc"></div></div><div class="accents" id="accents"></div></div>
  </div>
</section>

<section class="page" id="p-agents">
  <h1 data-i18n="agents.title"></h1><div class="sub" data-i18n="agents.sub"></div>
  <div class="panel">
    <div class="row"><div class="ico">✦</div><div class="l">Claude Code<div class="d" data-i18n="agents.claudeDesc"></div></div><span class="badge" id="cl-badge"></span><button class="btn" id="cl-btn"></button></div>
    <div class="row"><div class="ico">◎</div><div class="l">Codex<div class="d" id="cx-desc"></div></div><span class="badge" id="cx-badge"></span><button class="btn" id="cx-btn"></button></div>
    <div class="note" id="cx-note" data-i18n-html="agents.codexNoteHtml" hidden></div>
  </div>
  <h2 data-i18n="agents.permissions"></h2>
  <div class="panel">
    <div class="row"><div class="l"><span data-i18n="agents.wait"></span><div class="d" data-i18n="agents.waitDesc"></div></div><input type="number" min="30" max="1800" data-k="permission_wait" data-num data-lazy></div>
    <div class="row"><div class="l"><span data-i18n="agents.focus"></span><div class="d" data-i18n="agents.focusDesc"></div></div><label class="sw"><input type="checkbox" data-k="focus_terminal_after_decision"><span></span></label></div>
  </div>
</section>

<section class="page" id="p-mods">
  <h1 data-i18n="mods.title"></h1><div class="sub" data-i18n="mods.sub"></div>
  <div class="panel" id="modules"></div>
</section>

<section class="page" id="p-conn">
  <h1 data-i18n="conn.title"></h1><div class="sub" data-i18n="conn.sub"></div>
  <div class="panel">
    <div class="row"><div class="ico">📅</div><div class="l">Microsoft 365<div class="d" id="m365-desc"></div></div><span class="badge" id="m365-badge"></span><button class="btn" id="m365-btn"></button></div>
    <div class="row"><div class="l"><span data-i18n="conn.clientId"></span><div class="d" data-i18n="conn.clientIdDesc"></div></div><input type="text" data-k="connectors.m365.client_id" data-lazy data-i18n-placeholder="conn.clientIdPlaceholder" style="width:230px"></div>
    <div class="row"><div class="l"><span data-i18n="conn.tenant"></span><div class="d" data-i18n-html="conn.tenantDescHtml"></div></div><input type="text" data-k="connectors.m365.tenant" data-lazy></div>
    <div class="row"><div class="l"><span data-i18n="conn.alert"></span><div class="d" data-i18n="conn.alertDesc"></div></div><input type="number" min="0" max="60" data-k="connectors.m365.alert_minutes" data-num data-lazy></div>
    <div class="note guide" data-i18n-html="conn.guideHtml"></div>
  </div>
  <h2 data-i18n="conn.soon"></h2>
  <div class="panel soon">
    <div class="row"><div class="ico">🔵</div><div class="l">Google Workspace<div class="d" data-i18n="conn.google.desc"></div></div><span class="badge" data-i18n="conn.soonBadge"></span></div>
    <div class="row"><div class="ico">🗄️</div><div class="l">SQL Server<div class="d" data-i18n="conn.sql.desc"></div></div><span class="badge" data-i18n="conn.soonBadge"></span></div>
    <div class="row"><div class="ico">☁️</div><div class="l">Azure SQL<div class="d" data-i18n="conn.azsql.desc"></div></div><span class="badge" data-i18n="conn.soonBadge"></span></div>
    <div class="row"><div class="ico">🏭</div><div class="l">Azure Data Factory<div class="d" data-i18n="conn.adf.desc"></div></div><span class="badge" data-i18n="conn.soonBadge"></span></div>
  </div>
</section>

<section class="page" id="p-alerts">
  <h1 data-i18n="alerts.title"></h1><div class="sub" data-i18n="alerts.sub"></div>
  <div class="panel">
    <div class="row"><div class="l"><span data-i18n="alerts.context"></span><div class="d" data-i18n="alerts.contextDesc"></div></div><input type="number" min="50" max="99" data-k="alerts.context" data-num data-lazy></div>
    <div class="row"><div class="l"><span data-i18n="alerts.limits"></span><div class="d" data-i18n="alerts.limitsDesc"></div></div><input type="text" data-k="alerts.limits" data-list data-lazy style="width:100px;text-align:right"></div>
  </div>
  <h2 data-i18n="alerts.sounds"></h2>
  <div class="panel">
    <div class="row"><div class="l" data-i18n="sound.permission"></div><label class="sw"><input type="checkbox" data-k="sounds.permission"><span></span></label></div>
    <div class="row"><div class="l" data-i18n="sound.done"></div><label class="sw"><input type="checkbox" data-k="sounds.done"><span></span></label></div>
    <div class="row"><div class="l" data-i18n="sound.alert"></div><label class="sw"><input type="checkbox" data-k="sounds.alert"><span></span></label></div>
    <div class="row"><div class="l" data-i18n="sound.timer"></div><label class="sw"><input type="checkbox" data-k="sounds.timer"><span></span></label></div>
  </div>
</section>

<section class="page" id="p-timer">
  <h1 data-i18n="pomo.title"></h1><div class="sub" data-i18n="pomo.sub"></div>
  <div class="panel">
    <div class="row"><div class="l" data-i18n="pomo.focus"></div><input type="number" min="1" max="180" data-k="pomodoro.focus" data-num data-lazy></div>
    <div class="row"><div class="l" data-i18n="pomo.shortBreak"></div><input type="number" min="1" max="60" data-k="pomodoro.short_break" data-num data-lazy></div>
    <div class="row"><div class="l" data-i18n="pomo.longBreak"></div><input type="number" min="1" max="90" data-k="pomodoro.long_break" data-num data-lazy></div>
    <div class="row"><div class="l" data-i18n="pomo.cycles"></div><input type="number" min="1" max="10" data-k="pomodoro.cycles" data-num data-lazy></div>
  </div>
</section>

<section class="page" id="p-upd">
  <h1 data-i18n="upd.title"></h1><div class="sub" data-i18n="upd.sub"></div>
  <div class="panel">
    <div class="row"><div class="ico">⬆️</div><div class="l"><span id="upd-msg"></span><div class="d" id="upd-detail"></div></div><button class="btn primary" id="upd-now" data-i18n="update.now" hidden></button><button class="btn" id="upd-btn" data-i18n="upd.checkNow"></button></div>
    <div class="row"><div class="l"><span data-i18n="upd.mode"></span><div class="d" data-i18n="upd.modeDesc"></div></div><div class="seg" data-seg="updates"><button data-v="auto" data-i18n="upd.modeAuto"></button><button data-v="notify" data-i18n="upd.modeNotify"></button><button data-v="off" data-i18n="upd.modeOff"></button></div></div>
    <div class="row"><div class="l" data-i18n="upd.installedRow"></div><span class="msg" id="upd-ver"></span></div>
    <div class="row"><div class="l" data-i18n="upd.lastCheck"></div><span class="msg" id="upd-last"></span></div>
    <div class="row" id="upd-notes-row" hidden><div class="l"><span data-i18n="upd.notes"></span><div class="d" id="upd-notes-desc"></div></div><button class="btn" id="upd-notes" data-i18n="upd.openNotes"></button></div>
    <div class="row"><div class="l"><span data-i18n="upd.source"></span><div class="d" data-i18n="upd.sourceDesc"></div><input type="text" class="wide" data-k="update_url" data-lazy style="margin-top:7px"></div></div>
  </div>
</section>

<section class="page" id="p-info">
  <h1 data-i18n="info.title"></h1><div class="sub" data-i18n="info.sub"></div>
  <div class="panel">
    <div class="about"><div class="logo"><i></i></div><div><b>Skerry</b><span id="ver3"></span></div></div>
    <div class="row"><div class="l"><span data-i18n="info.logs"></span><div class="d"><code id="logdir"></code></div></div><button class="btn" id="logs" data-i18n="info.openFolder"></button></div>
    <div class="row"><div class="l"><span data-i18n="diag.title"></span><div class="d" data-i18n="diag.desc"></div><div class="d" id="diag-msg"></div></div><button class="btn" id="diag-btn" data-i18n="diag.copy"></button></div>
  </div>
</section>
</main>

<script src="i18n.js"></script>
<script>
// [key, icon, name (literal for product names, or a translation key), description key]
const MODULES = [
  ['claude', '✦', 'Claude Code'], ['codex', '◎', 'Codex'], ['media', '🎵'], ['privacy', '🎙️'], ['battery', '🔋'],
  ['bluetooth', '🎧'], ['usage', '📊'], ['timer', '⏱️'], ['calendar', '📅'], ['shelf', '📎'],
];
const ACCENTS = ['#d97757','#0a84ff','#30d158','#bf5af2','#ff9f0a','#ff375f','#64d2ff'];
let D = null;
const api = () => window.pywebview.api;
const get = (o, k) => k.split('.').reduce((a, p) => a == null ? a : a[p], o);
const $ = id => document.getElementById(id);

function save(k, v){ api().set_setting(k, v).then(() => { setTimeout(load, 120); }); }

function show(p){
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'p-' + p));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  $('main').scrollTop = 0;
  try { localStorage.setItem('skerry.page', p); } catch (e) {}
}

function renderModules(){
  $('modules').innerHTML = MODULES.map(([k, i, name]) =>
    `<div class="row"><div class="ico">${i}</div><div class="l">${name || tx('mod.' + k)}<div class="d">${tx('mod.' + k + '.desc')}</div></div><label class="sw"><input type="checkbox" data-k="modules.${k}"><span></span></label></div>`).join('');
  document.querySelectorAll('#modules input[type=checkbox][data-k]').forEach(el => el.addEventListener('change', () => save(el.dataset.k, el.checked)));
}

function bind(){
  renderModules();
  $('accents').innerHTML = ACCENTS.map(c => `<i data-c="${c}" style="background:${c}"></i>`).join('');
  $('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.p); });
  document.querySelectorAll('input[type=checkbox][data-k]:not(#modules input)').forEach(el => el.addEventListener('change', () => save(el.dataset.k, el.checked)));
  document.querySelectorAll('input[data-lazy]').forEach(el => el.addEventListener('change', () => {
    let v = el.value.trim();
    if (el.dataset.num !== undefined) v = Number(v);
    if (el.dataset.list !== undefined) v = v.split(',').map(x => Number(x.trim())).filter(x => x > 0 && x <= 100);
    save(el.dataset.k, v);
    if (el.dataset.k === 'permission_wait') relink();
  }));
  document.querySelectorAll('[data-seg]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (b) save(seg.dataset.seg, b.dataset.v);
  }));
  $('accents').addEventListener('click', e => { const i = e.target.closest('i'); if (i) save('accent', i.dataset.c); });
  $('center').onclick = () => save('offset', 0.5);
  $('m365-btn').onclick = async () => { if (D.connectors.m365.status === 'ok') await api().connector_logout('m365'); else await api().connector_login('m365'); load(); };
  $('cl-btn').onclick = () => connect('claude');
  $('cx-btn').onclick = () => connect('codex');
  $('logs').onclick = () => api().open_logs();
  $('onb-btn').onclick = () => api().onboarding_restart();
  $('diag-btn').onclick = async () => {
    const b = $('diag-btn'), m = $('diag-msg');
    b.disabled = true;
    const r = await api().copy_diagnostics();
    b.disabled = false;
    m.textContent = r.ok ? t('diag.copied', {n: r.lines}) : t('diag.failed');
    m.style.color = r.ok ? 'var(--green)' : 'var(--red)';
  };
  $('upd-btn').onclick = async () => { $('upd-btn').disabled = true; D.update = await api().check_updates(); renderUpdate(); load(); };
  $('upd-now').onclick = async () => { $('upd-now').disabled = true; await api().install_update(); setTimeout(load, 300); };
  $('upd-notes').onclick = () => api().open_release_notes();
  let p = 'gen'; try { p = localStorage.getItem('skerry.page') || 'gen'; } catch (e) {}
  show(document.getElementById('p-' + p) ? p : 'gen');
}

const UPD_BUSY = ['checking', 'downloading', 'installing'];
function renderUpdate(){
  const u = D.update || {}, v = {version: u.version, error: u.error};
  $('upd-msg').textContent = t('upd.status.' + (u.status || 'idle'), v);
  $('upd-detail').textContent = u.can_install === false ? t('upd.devNote') : '';
  $('upd-ver').textContent = D.version;
  $('upd-last').textContent = u.last_check ? I18N.dateTime(u.last_check) : t('upd.never');
  $('upd-now').hidden = !(u.can_install && ['available', 'ready'].includes(u.status));
  $('upd-now').disabled = false;
  $('upd-btn').disabled = UPD_BUSY.includes(u.status);
  $('upd-notes-row').hidden = !u.notes_url;
  $('upd-notes-desc').textContent = u.notes_url ? t('upd.notesDesc', v) : '';
  $('upd-dot').hidden = !['available', 'ready'].includes(u.status);
}

async function connect(agent){
  const st = D[agent], btn = $(agent === 'claude' ? 'cl-btn' : 'cx-btn');
  btn.disabled = true;
  const r = await (agent === 'claude' ? api().claude_connect(!st.installed) : api().codex_connect(!st.installed));
  btn.disabled = false;
  if (!r.ok) alert(t('err.operation', {error: r.error}));
  if (agent === 'codex' && r.ok && r.installed) $('cx-note').hidden = false;
  load();
}
async function relink(){
  if (D.claude.installed) await api().claude_connect(true);
  if (D.codex.installed) await api().codex_connect(true);
}

async function load(){
  D = await api().get_settings();
  const s = D.settings;
  if (I18N.setLang(D.lang) || !document.body.classList.contains('ready')){ I18N.apply(); renderModules(); }
  document.body.classList.add('ready');
  document.documentElement.dataset.theme = s.theme;
  document.documentElement.style.setProperty('--accent', s.accent);
  $('ver').textContent = 'v' + D.version; $('ver3').textContent = t('info.version', {version: D.version});
  $('logdir').textContent = D.log_dir;
  const sc = $('screen'); sc.dataset.e = s.edge; sc.style.setProperty('--o', Math.min(.9, Math.max(.1, s.offset ?? .5)));
  document.querySelectorAll('input[data-k]').forEach(el => {
    const v = el.dataset.k === 'autostart' ? D.autostart : get(s, el.dataset.k);
    if (el.type === 'checkbox') el.checked = !!v;
    else if (document.activeElement !== el) el.value = Array.isArray(v) ? v.join(', ') : (v ?? '');
  });
  document.querySelectorAll('[data-seg]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', (s[seg.dataset.seg] ?? 'auto') === b.dataset.v)));
  document.querySelectorAll('#accents i').forEach(i => i.classList.toggle('on', i.dataset.c.toLowerCase() === String(s.accent).toLowerCase()));
  const badge = (id, st, avail) => { const b = $(id);
    b.className = 'badge ' + (st.installed ? 'ok' : 'no'); b.textContent = t(st.installed ? 'status.connected' : (avail === false ? 'status.notFound' : 'status.notConnected')); };
  badge('cl-badge', D.claude); badge('cx-badge', D.codex, D.codex.available);
  $('cl-btn').textContent = t(D.claude.installed ? 'btn.disconnect' : 'btn.connect');
  $('cl-btn').className = 'btn' + (D.claude.installed ? '' : ' primary');
  $('cx-btn').textContent = t(D.codex.installed ? 'btn.disconnect' : 'btn.connect');
  $('cx-btn').className = 'btn' + (D.codex.installed ? '' : ' primary');
  $('cx-btn').disabled = !D.codex.installed && D.codex.available === false;
  $('cx-desc').textContent = t(D.codex.available === false ? 'agents.codexMissing' : 'agents.codexDesc');
  const mc = D.connectors && D.connectors.m365 || {};
  const mb = $('m365-badge'), mbt = $('m365-btn');
  const label = t({signed_out: 'status.notConnected', signing_in: 'status.signingIn', ok: 'status.connected', error: 'status.error'}[mc.status] || 'status.notConnected');
  mb.className = 'badge ' + (mc.status === 'ok' ? 'ok' : mc.status === 'error' ? 'err' : 'no');
  mb.textContent = mc.status === 'ok' && mc.account ? mc.account : label;
  mbt.textContent = t(mc.status === 'ok' ? 'btn.signOut' : (mc.status === 'signing_in' ? 'btn.wait' : 'btn.signIn'));
  mbt.className = 'btn' + (mc.status === 'ok' || mc.status === 'signing_in' ? '' : ' primary');
  mbt.disabled = mc.status === 'signing_in';
  $('m365-desc').textContent = mc.status === 'error' && mc.error ? mc.error : t('conn.m365Desc');
  $('m365-desc').style.color = mc.status === 'error' ? 'var(--red)' : '';
  renderUpdate();
  // refresh while something is in progress (Microsoft sign-in, update check or download)
  const busy = mc.status === 'signing_in' || UPD_BUSY.includes((D.update || {}).status);
  if (busy && !window.__poll) window.__poll = setInterval(load, 1500);
  else if (!busy && window.__poll){ clearInterval(window.__poll); window.__poll = null; }
}

window.addEventListener('pywebviewready', () => { bind(); load(); });
</script>
</body>
</html>
