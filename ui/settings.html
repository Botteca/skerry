<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Settings · Skerry</title>
<style>
  @font-face{font-family:"Inter";src:url("fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
  :root{--bg:#0e0e10;--side:#131316;--panel:#1a1a1e;--panel2:#212126;--line:#2b2b31;--fg:#f4f4f6;--muted:#8d8d95;--accent:#d97757;--green:#30d158;--red:#ff453a;--amber:#ff9f0a;--ease:cubic-bezier(.22,1,.36,1)}
  :root[data-theme=light]{--bg:#f3f3f6;--side:#eaeaef;--panel:#fff;--panel2:#f0f0f4;--line:#e0e0e6;--fg:#1c1c1e;--muted:#6c6c74}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font:13.5px/1.45 "Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;-webkit-font-smoothing:antialiased}
  /* ---------- sidebar ---------- */
  aside{width:208px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 14px}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px}
  .logo{width:46px;height:20px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;box-shadow:0 0 0 1px var(--line);flex:none}
  .logo i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:background .3s,box-shadow .3s}
  .brand b{font-size:16px;font-weight:650;display:block;line-height:1.1} .brand span{font-size:11px;color:var(--muted)}
  nav{display:flex;flex-direction:column;gap:2px;flex:1}
  nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:9px;font:inherit;font-weight:500;cursor:pointer;text-align:left;position:relative;transition:background .15s,color .15s}
  nav button .em{width:18px;flex:none;font-style:normal;font-size:15px;line-height:1;text-align:center;filter:grayscale(.65);opacity:.75;transition:filter .15s,opacity .15s}
  nav button:hover{background:var(--panel2);color:var(--fg)}
  nav button.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
  nav button.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  nav button:hover .em,nav button.on .em{filter:none;opacity:1}
  .upd-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .foot{font-size:11px;color:var(--muted);padding:10px 10px 0}
  /* ---------- content ---------- */
  main{flex:1;min-width:0;overflow-y:auto;padding:26px 34px 40px;scroll-behavior:smooth}
  main::-webkit-scrollbar{width:10px} main::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:2px solid var(--bg)}
  .page{display:none;max-width:640px;animation:in .38s var(--ease) both} .page.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-size:22px;font-weight:650;letter-spacing:-.2px} .sub{color:var(--muted);margin:2px 0 18px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
  .panel{background:var(--panel);border-radius:14px;border:1px solid var(--line);overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line);min-height:56px;transition:background .15s}
  .row:first-child{border-top:0} .row:hover{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  .row .l{flex:1;min-width:0;font-weight:500} .row .d{color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
  .ico{width:32px;height:32px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:15px}
  .sw{position:relative;width:42px;height:25px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
  .sw span{position:absolute;inset:0;border-radius:13px;background:var(--line);transition:background .25s var(--ease)}
  .sw span:before{content:"";position:absolute;width:21px;height:21px;left:2px;top:2px;border-radius:50%;background:#fff;transition:transform .3s var(--ease),width .2s;box-shadow:0 1px 3px #0006}
  .sw:active span:before{width:25px} .sw input:checked+span{background:var(--accent)}
  .sw input:checked+span:before{transform:translateX(17px)} .sw input:checked:active+span:before{transform:translateX(13px)}
  .sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
  select,input[type=text],input[type=number],input[type=password]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;outline:0;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  input[type=number]{width:84px;text-align:right} input[type=text]{width:190px} input.wide{width:100%}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:5px 13px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
  .seg button:hover{color:var(--fg)} .seg button.on{background:var(--accent);color:#fff;box-shadow:0 1px 4px #0004}
  .accents{display:flex;gap:10px;align-items:center}
  .accents i{width:24px;height:24px;border-radius:50%;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 0 0 2px var(--panel)}
  .accents i:hover{transform:scale(1.14)} .accents i.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg)}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 15px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
  .btn:hover{border-color:var(--muted)} .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.45;cursor:default}
  .badge{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:10px;background:var(--panel2);color:var(--muted);white-space:nowrap}
  .badge.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
  .badge.no{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
  .note{color:var(--muted);font-size:12px;padding:11px 16px 13px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--amber) 7%,transparent)}
  kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:12px Consolas,monospace}
  /* edge picker with preview */
  .edge{display:flex;gap:22px;align-items:center;padding:18px 16px}
  .screen{width:190px;height:118px;border-radius:9px;background:var(--panel2);border:2px solid var(--line);position:relative;flex:none;box-shadow:inset 0 0 30px #0003}
  .screen::after{content:"";position:absolute;left:50%;bottom:-9px;width:46px;height:7px;background:var(--line);border-radius:0 0 4px 4px;transform:translateX(-50%)}
  .pill{position:absolute;background:#000;border-radius:7px;box-shadow:0 0 0 1px var(--line);transition:all .45s var(--ease);display:flex;align-items:center;justify-content:center}
  .pill i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .screen[data-e=top] .pill{left:calc(var(--o)*100% - 22px);top:6px;width:44px;height:13px}
  .screen[data-e=bottom] .pill{left:calc(var(--o)*100% - 22px);top:calc(100% - 19px);width:44px;height:13px}
  .screen[data-e=left] .pill{top:calc(var(--o)*100% - 22px);left:6px;width:13px;height:44px}
  .screen[data-e=right] .pill{top:calc(var(--o)*100% - 22px);left:calc(100% - 19px);width:13px;height:44px}
  .edge .ctl{flex:1;display:flex;flex-direction:column;gap:12px}
  .hint{font-size:12px;color:var(--muted)}
  .msg{font-size:12px;color:var(--muted)}
  .about{display:flex;gap:16px;align-items:center;padding:22px 18px}
  .about .logo{width:78px;height:30px;border-radius:15px;padding-right:10px} .about .logo i{width:10px;height:10px}
  .about b{font-size:17px;display:block} .about span{color:var(--muted);font-size:12.5px}
  .soon .row{opacity:.62} .soon .row:hover{background:transparent}
  .guide{background:var(--panel2);line-height:1.55} .guide>b:first-child{display:block;color:var(--fg);margin-bottom:4px;font-size:12.5px}
  .guide ol{padding-left:18px} .guide li{margin:3px 0} .guide code{color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}
  .conn + .conn{margin-top:10px}
  .conn .head{cursor:pointer;user-select:none} .conn .head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .conn .head .l{font-weight:600}
  .chev{width:8px;height:8px;flex:none;margin:0 2px 0 4px;border:solid var(--muted);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
  .conn.open .chev{transform:rotate(-135deg) translate(-2px,0)}
  .conn:not(.open) > .body{display:none} .conn > .body{border-top:1px solid var(--line)}
  .conn input[type=text],.conn input[type=password]{width:300px!important;max-width:46%}
  .howto{border-top:1px solid var(--line)}
  .howto>summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px}
  .howto>summary::-webkit-details-marker{display:none}
  .howto>summary::before{content:"📖"} .howto>summary::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:rotate(-45deg);transition:transform .2s;margin-left:2px}
  .howto[open]>summary::after{transform:rotate(45deg)}
  .howto>.guide{border-top:1px solid var(--line)}
  .badge.err{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
  input::placeholder{color:var(--muted);opacity:.55}
  code{font:12px Consolas,monospace;color:var(--muted);word-break:break-all}
  @media (max-width:760px){aside{width:64px;padding:16px 8px}.brand div,nav button span,.foot{display:none}.brand{padding:0 0 16px;justify-content:center}.logo{display:none}nav button{justify-content:center;padding:10px}nav button.on::before{left:-8px}}
  body:not(.ready){visibility:hidden}  /* until the first load() applies the language */
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:12.5px Consolas,"Cascadia Mono",monospace;outline:0;width:100%;min-height:64px;resize:vertical}
  textarea:focus{border-color:var(--accent)}
  .sqlw{border-top:1px solid var(--line);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .sqlw label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)} .sqlw .full{grid-column:1/-1}
  .sqlw input[type=text],.sqlw input[type=password],.sqlw input[type=number]{width:100%;text-align:left}
  .sqlw .err{color:var(--red);font-size:12px} .sqlw .ok{color:var(--green);font-size:12px}
  .sqlw .chk{flex-direction:row;align-items:center;gap:8px}
  .sortable{position:relative}
  .sitem{position:relative;background:var(--panel);border-top:1px solid var(--line)} .sortable .sitem:first-child{border-top:0}
  .sitem .row{border-top:0}
  .sitem.dragging{z-index:5;box-shadow:0 10px 28px #0007;border-radius:10px;transition:none!important;opacity:.97}
  .sitem.dragging .handle{cursor:grabbing}
  .handle{border:0;background:transparent;color:var(--muted);cursor:grab;font-size:16px;padding:4px 6px;border-radius:6px;touch-action:none;line-height:1}
  .handle:focus-visible,.mv:focus-visible{outline:2px solid var(--accent)}
  .handle[disabled]{cursor:default;opacity:.35}
  .mv{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:7px;width:28px;height:26px;cursor:pointer;font-size:11px}
  .mv:disabled{opacity:.3;cursor:default}
  .sitem.off .l,.sitem.off .ico{opacity:.45}
  .opts{padding:2px 16px 12px 62px;display:flex;flex-direction:column;gap:6px}
  .opts .orow{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .opts .orow .l{flex:1} .opts .orow input[type=text]{width:200px}
  .more{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
  .hproj{cursor:pointer} .hsess .row{gap:12px;padding:7px 16px 7px 58px;min-height:0;font-size:12px;color:var(--muted)}
  .hsess .row b{color:var(--fg);font-weight:500}
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo"><i></i></div><div><b>Skerry</b><span id="ver"></span></div></div>
  <nav id="nav">
    <button data-p="gen"><i class="em">⚙️</i><span data-i18n="nav.general"></span></button>
    <button data-p="look"><i class="em">🎨</i><span data-i18n="nav.look"></span></button>
    <button data-p="agents"><i class="em">🤖</i><span data-i18n="nav.agents"></span></button>
    <button data-p="hist"><i class="em">🕘</i><span data-i18n="nav.history"></span></button>
    <button data-p="layout"><i class="em">🧩</i><span data-i18n="nav.layout"></span></button>
    <button data-p="conn"><i class="em">🔌</i><span data-i18n="nav.connections"></span></button>
    <button data-p="alerts"><i class="em">🔔</i><span data-i18n="nav.alerts"></span></button>
    <button data-p="timer"><i class="em">🍅</i><span data-i18n="nav.pomodoro"></span></button>
    <button data-p="upd"><i class="em">🔄</i><span data-i18n="nav.updates"></span><i class="upd-dot" id="upd-dot" hidden></i></button>
    <button data-p="info"><i class="em">ℹ️</i><span data-i18n="nav.info"></span></button>
  </nav>
  <div class="foot" data-i18n="nav.autosave"></div>
</aside>

<main id="main">
<section class="page" id="p-gen">
  <h1 data-i18n="gen.title"></h1><div class="sub" data-i18n="gen.sub"></div>
  <div class="panel">
    <div class="row"><div class="ico">🌐</div><div class="l"><span data-i18n="gen.language"></span><div class="d" data-i18n="gen.languageDesc"></div></div><select id="lang-sel"><option value="auto" data-i18n="lang.auto"></option><option value="en" data-i18n="lang.en"></option><option value="it" data-i18n="lang.it"></option><option value="es" data-i18n="lang.es"></option><option value="de" data-i18n="lang.de"></option><option value="fr" data-i18n="lang.fr"></option></select></div>
    <div class="row"><div class="ico">🧭</div><div class="l"><span data-i18n="gen.onboarding"></span><div class="d" data-i18n="gen.onboardingDesc"></div></div><button class="btn" id="onb-btn" data-i18n="gen.onboardingBtn"></button></div>
    <div class="row"><div class="ico">🚀</div><div class="l"><span data-i18n="gen.autostart"></span><div class="d" data-i18n="gen.autostartDesc"></div></div><label class="sw"><input type="checkbox" data-k="autostart"><span></span></label></div>
    <div class="row"><div class="ico">⌨️</div><div class="l"><span data-i18n="gen.hotkey"></span><div class="d" data-i18n-html="gen.hotkeyDescHtml"></div></div><input type="text" data-k="hotkey" data-lazy></div>
  </div>
  <h2 data-i18n="gen.backup"></h2>
  <div class="panel">
    <div class="row"><div class="ico">💾</div><div class="l"><span data-i18n="gen.backupTitle"></span><div class="d" data-i18n="gen.backupDesc"></div><div class="d" id="backup-msg"></div></div><button class="btn" id="settings-import" data-i18n="gen.import"></button><button class="btn" id="settings-export" data-i18n="gen.export"></button></div>
  </div>
  <h2 data-i18n="gen.privacy"></h2>
  <div class="panel">
    <div class="row"><div class="ico">🖥️</div><div class="l"><span data-i18n="gen.hideCapture"></span><div class="d" data-i18n="gen.hideCaptureDesc"></div></div><label class="sw"><input type="checkbox" data-k="hide_from_capture"><span></span></label></div>
    <div class="row"><div class="ico">🎬</div><div class="l"><span data-i18n="gen.hideFullscreen"></span><div class="d" data-i18n="gen.hideFullscreenDesc"></div></div><label class="sw"><input type="checkbox" data-k="hide_fullscreen"><span></span></label></div>
    <div class="row"><div class="ico">🔐</div><div class="l"><span data-i18n="gen.permOverFullscreen"></span><div class="d" data-i18n="gen.permOverFullscreenDesc"></div></div><label class="sw"><input type="checkbox" data-k="permission_over_fullscreen"><span></span></label></div>
  </div>
</section>

<section class="page" id="p-look">
  <h1 data-i18n="look.title"></h1><div class="sub" data-i18n="look.sub"></div>
  <div class="panel">
    <div class="edge">
      <div class="screen" id="screen" data-e="top" style="--o:.5"><div class="pill"><i></i></div></div>
      <div class="ctl">
        <div class="seg" data-seg="edge"><button data-v="top" data-i18n="look.top"></button><button data-v="bottom" data-i18n="look.bottom"></button><button data-v="left" data-i18n="look.left"></button><button data-v="right" data-i18n="look.right"></button></div>
        <div style="display:flex;gap:10px;align-items:center"><button class="btn" id="center" data-i18n="look.center"></button><span class="hint" data-i18n="look.dragHint"></span></div>
      </div>
    </div>
  </div>
  <div class="panel" style="margin-top:12px">
    <div class="row"><div class="ico">🖥️</div><div class="l"><span data-i18n="look.screen"></span><div class="d" data-i18n="look.screenDesc"></div></div><select id="mon-sel" style="max-width:300px"></select></div>
  </div>
  <h2 data-i18n="look.themeSection"></h2>
  <div class="panel">
    <div class="row"><div class="l" data-i18n="look.theme"></div><div class="seg" data-seg="theme"><button data-v="dark" data-i18n="look.dark"></button><button data-v="light" data-i18n="look.light"></button></div></div>
    <div class="row"><div class="l"><span data-i18n="look.idleLabel"></span><div class="d" data-i18n="look.idleLabelDesc"></div></div><div class="seg" data-seg="idle_label"><button data-v="usage" data-i18n="look.idleUsage"></button><button data-v="name">Skerry</button><button data-v="clock" data-i18n="look.idleClock"></button><button data-v="icon" data-i18n="look.idleIcon"></button></div></div>
    <div class="row"><div class="l"><span data-i18n="look.accent"></span><div class="d" data-i18n="look.accentDesc"></div></div><div class="accents" id="accents"></div></div>
    <div class="row"><div class="l"><span data-i18n="look.companion"></span><div class="d" data-i18n="look.companionDesc"></div></div><div class="seg" data-seg="companion.style"><button data-v="off" data-i18n="look.cmpOff"></button><button data-v="dot" data-i18n="look.cmpDot"></button><button data-v="eyes" data-i18n="look.cmpEyes"></button></div></div>
    <div class="row"><div class="l"><span data-i18n="look.energy"></span><div class="d" data-i18n="look.energyDesc"></div></div><div class="seg" data-seg="companion.energy"><button data-v="lively" data-i18n="look.lively"></button><button data-v="calm" data-i18n="look.calm"></button></div></div>
  </div>
</section>

<section class="page" id="p-agents">
  <h1 data-i18n="agents.title"></h1><div class="sub" data-i18n="agents.sub"></div>
  <div class="panel">
    <div id="agents-list"></div>
    <div class="note" id="cx-note" data-i18n-html="agents.codexNoteHtml" hidden></div>
  </div>
  <h2 data-i18n="agents.permissions"></h2>
  <div class="panel">
    <div class="row"><div class="l"><span data-i18n="agents.wait"></span><div class="d" data-i18n="agents.waitDesc"></div></div><input type="number" min="30" max="1800" data-k="permission_wait" data-num data-lazy></div>
    <div class="row"><div class="l"><span data-i18n="agents.focus"></span><div class="d" data-i18n="agents.focusDesc"></div></div><label class="sw"><input type="checkbox" data-k="focus_terminal_after_decision"><span></span></label></div>
  </div>
</section>

<section class="page" id="p-hist">
  <h1 data-i18n="hist.title"></h1><div class="sub" data-i18n="hist.sub"></div>
  <div class="panel">
    <div class="row"><div class="l"><span id="hist-sum"></span><div class="d" data-i18n="hist.note"></div><div class="d" id="hist-msg"></div></div><button class="btn" id="hist-csv" data-i18n="hist.export"></button></div>
  </div>
  <div class="panel" id="hist-list"></div>
</section>

<section class="page" id="p-layout">
  <h1 data-i18n="lay.title"></h1><div class="sub" data-i18n="lay.sub"></div>
  <div class="panel">

<script>
// Sub-switches shown inside the Agents and System sections of the Layout page.
// [key, icon, name (literal for product names, or a translation key), description key]
const MODULES = [
  ['claude', '✦', 'Claude Code'], ['codex', '◎', 'Codex'], ['gemini', '✧', 'Gemini CLI'], ['copilot', '⬢', 'Copilot CLI'],
  ['opencode', '▣', 'OpenCode'],
  ['privacy', '🎙️'], ['battery', '🔋'], ['bluetooth', '🎧'],
];
// [agent, icon, product name, description key]
const AGENTS = [
  ['claude', '✦', 'Claude Code', 'agents.claudeDesc'], ['codex', '◎', 'Codex', 'agents.codexDesc'],
  ['gemini', '✧', 'Gemini CLI', 'agents.geminiDesc'], ['copilot', '⬢', 'GitHub Copilot CLI', 'agents.copilotDesc'],
  ['opencode', '▣', 'OpenCode', 'agents.opencodeDesc'],
];
const ICON = Object.fromEntries(AGENTS.map(([a, i]) => [a, i]));
const ACCENTS = ['#d97757','#0a84ff','#30d158','#bf5af2','#ff9f0a','#ff375f','#64d2ff'];
let D = null;
const api = () => window.pywebview.api;
const get = (o, k) => k.split('.').reduce((a, p) => a == null ? a : a[p], o);
const $ = id => document.getElementById(id);

function save(k, v){ api().set_setting(k, v).then(() => { setTimeout(load, 120); }); }

function show(p){
  if (p === 'hist') loadHistory();
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'p-' + p));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  $('main').scrollTop = 0;
  try { localStorage.setItem('skerry.page', p); } catch (e) {}
}

// ---------------- Layout page ----------------
// [id, icon, name key, description key]; ids are the stable section ids of skerry/layout.py
const SECTIONS = [
  ['media', '🎵', 'mod.media', 'mod.media.desc'], ['meeting', '📅', 'mod.calendar', 'mod.calendar.desc'],
  ['adf', '🏭', 'mod.adf', 'mod.adf.desc'], ['sql', '🗄️', 'mod.sql', 'mod.sql.desc'],
  ['agents', '✦', 'sec.agents', 'sec.agents.desc'], ['usage', '📊', 'mod.usage', 'mod.usage.desc'],
  ['system', '🔋', 'sec.system', 'sec.system.desc'], ['timer', '⏱️', 'mod.timer', 'mod.timer.desc'],
  ['shelf', '📎', 'mod.shelf', 'mod.shelf.desc'],
];
// closed pill events, same ids as layout.PILL
const PILL_EVENTS = [
  ['permission', '🔐', 'pill.permission', 'pill.permission.desc'], ['agent', '✦', 'pill.agent', 'pill.agent.desc'],
  ['meeting', '📅', 'pill.meeting', 'pill.meeting.desc'], ['media', '🎵', 'pill.media', 'pill.media.desc'],
  ['timer', '⏱️', 'pill.timer', 'pill.timer.desc'], ['battery', '🪫', 'pill.battery', 'pill.battery.desc'],
];
const PROFILE_NAMES = {work: 'profile.work', present: 'profile.present', focus: 'profile.focus'};
const USAGE_VIEWS = [['all', 'lay.usageAll'], ['tokens', 'lay.usageTokens'], ['percent', 'lay.usagePercent'], ['today', 'lay.usageToday']];
let layoutKey = null, openOpts = new Set();

function moduleRow(k){
  const [, i, name] = MODULES.find(m => m[0] === k);
  return `<div class="orow"><span>${i}</span><div class="l">${name ? esc(name) : tx('mod.' + k)} <span class="d">· ${tx('mod.' + k + '.desc')}</span></div>
    <label class="sw"><input type="checkbox" data-mod="${k}" ${get(D.settings, 'modules.' + k) !== false ? 'checked' : ''}><span></span></label></div>`;
}
function sectionOptions(id){
  const L = D.layout;
  if (id === 'agents') return ['claude', 'codex', 'gemini', 'copilot', 'opencode'].map(moduleRow).join('');
  if (id === 'usage') return `<div class="orow"><div class="l">${tx('lay.usageView')}</div><div class="seg" data-useg>${USAGE_VIEWS
    .map(([v, k]) => `<button data-v="${v}" class="${L.usage_view === v ? 'on' : ''}">${tx(k)}</button>`).join('')}</div></div>`;
  if (id === 'meeting') return `<div class="orow"><div class="l">${tx('lay.meetingAhead')}<div class="d">${tx('lay.meetingAheadDesc')}</div></div>
    <input type="number" min="0" max="1440" data-ahead value="${L.meeting_ahead}"></div>`;
  if (id === 'system'){
    const bt = D.bluetooth || [];
    return ['privacy', 'battery', 'bluetooth'].map(moduleRow).join('')
      + (bt.length ? `<div class="orow"><div class="l"><b>${tx('lay.btDevices')}</b><div class="d">${tx('lay.btDevicesDesc')}</div></div></div>` : `<div class="d">${tx('lay.btNone')}</div>`)
      + bt.map(d => `<div class="orow"><span>🔹</span><div class="l">${esc(d.name)} <span class="d">· ${d.battery}%</span></div>
          <input type="text" data-bt="${esc(d.name)}" value="${esc(d.alias)}" placeholder="${esc(d.name)}" aria-label="${tx('lay.btRename', {name: d.name})}">
          <label class="sw"><input type="checkbox" data-btshow="${esc(d.name)}" ${d.shown ? 'checked' : ''} aria-label="${tx('lay.btShow', {name: d.name})}"><span></span></label></div>`).join('');
  }
  return '';
}
function itemHtml(kind, id, icon, nameKey, descKey, i, n, on, fixed){
  const name = t(nameKey), opts = kind === 'sec' ? sectionOptions(id) : '';
  return `<div class="sitem ${on ? '' : 'off'}" data-id="${id}" ${fixed ? 'data-fixed="1"' : ''} role="listitem">
    <div class="row">
      <button class="handle" data-handle ${fixed ? 'disabled' : ''} aria-label="${tx('lay.drag', {name})}" title="${tx('lay.dragTip')}">⠿</button>
      <div class="ico">${icon}</div><div class="l">${esc(name)}<div class="d">${tx(descKey)}</div></div>
      ${opts ? `<button class="more" data-more="${id}" aria-expanded="${openOpts.has(id)}">${tx(openOpts.has(id) ? 'lay.less' : 'lay.options')}</button>` : ''}
      <button class="mv" data-mv="-1" ${fixed || i === 0 || (kind === 'pill' && i === 1) ? 'disabled' : ''} aria-label="${tx('lay.up', {name})}">▲</button>
      <button class="mv" data-mv="1" ${fixed || i === n - 1 ? 'disabled' : ''} aria-label="${tx('lay.down', {name})}">▼</button>
      <label class="sw" ${fixed ? `title="${tx('lay.alwaysOn')}"` : ''}><input type="checkbox" data-vis ${on ? 'checked' : ''} ${fixed ? 'disabled' : ''} aria-label="${tx('lay.show', {name})}"><span></span></label>
    </div>${opts && openOpts.has(id) ? `<div class="opts">${opts}</div>` : ''}</div>`;
}
function renderLayout(force){
  const L = D.layout, key = JSON.stringify([L, D.settings.modules, D.bluetooth, [...openOpts], I18N.lang]);
  if (!force && key === layoutKey) return;
  layoutKey = key;
  const sec = Object.fromEntries(SECTIONS.map(s => [s[0], s])), pil = Object.fromEntries(PILL_EVENTS.map(p => [p[0], p]));
  $('sec-list').innerHTML = L.order.filter(id => sec[id]).map((id, i, a) => itemHtml('sec', ...sec[id], i, a.length, !L.hidden.includes(id))).join('');
  $('pill-list').innerHTML = L.pill.filter(id => pil[id]).map((id, i, a) => itemHtml('pill', ...pil[id], i, a.length,
    !L.pill_hidden.includes(id), id === 'permission')).join('');
  $('profile-seg').innerHTML = D.profiles.map(p => `<button data-v="${p}" class="${D.profile === p ? 'on' : ''}">${tx(PROFILE_NAMES[p])}</button>`).join('');
  $('auto-profile').innerHTML = D.profiles.map(p => `<option value="${p}">${tx(PROFILE_NAMES[p])}</option>`).join('');
  $('auto-profile').value = get(D.settings, 'profile_auto.profile');
}
function listIds(list){ return [...list.querySelectorAll(':scope > .sitem')].map(el => el.dataset.id); }
function saveOrder(list){
  const ids = listIds(list);
  save(list.id === 'sec-list' ? 'layout.order' : 'layout.pill', ids);
}
// Drag with the handle: the row follows the pointer, the others slide out of the way (FLIP animation).
function sortable(list){
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('[data-handle]');
    if (!h || h.disabled || e.button !== 0) return;
    const row = h.closest('.sitem'), startY = e.clientY;
    let shift = 0, lastY = e.clientY;
    e.preventDefault(); h.setPointerCapture(e.pointerId); row.classList.add('dragging');
    const place = () => { row.style.transform = `translateY(${lastY - startY - shift}px)`; };
    const slide = (other, update) => {
      const before = other.getBoundingClientRect().top, top0 = row.offsetTop;
      update();
      shift += row.offsetTop - top0;
      const after = other.getBoundingClientRect().top;
      other.style.transition = 'none'; other.style.transform = `translateY(${before - after}px)`;
      requestAnimationFrame(() => { other.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)'; other.style.transform = ''; });
      place();
    };
    const move = ev => {
      lastY = ev.clientY; place();
      const r = row.getBoundingClientRect(), mid = r.top + r.height / 2;
      const prev = row.previousElementSibling, next = row.nextElementSibling;
      if (next && mid > next.getBoundingClientRect().top + next.offsetHeight / 2) slide(next, () => next.after(row));
      else if (prev && !prev.dataset.fixed && mid < prev.getBoundingClientRect().top + prev.offsetHeight / 2) slide(prev, () => prev.before(row));
    };
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      row.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)'; row.style.transform = '';
      setTimeout(() => { row.classList.remove('dragging'); row.style.transition = ''; saveOrder(list); h.focus(); }, 200);
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  });
  // keyboard: arrows on the handle, or the up/down buttons
  const step = (row, d) => {
    const other = d < 0 ? row.previousElementSibling : row.nextElementSibling;
    if (!other || other.dataset.fixed) return false;
    if (d < 0) other.before(row); else other.after(row);
    saveOrder(list);
    return true;
  };
  list.addEventListener('keydown', e => {
    const h = e.target.closest('[data-handle]');
    if (!h || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const id = h.closest('.sitem').dataset.id;
    if (step(h.closest('.sitem'), e.key === 'ArrowUp' ? -1 : 1)) refocus(list, id, '[data-handle]');
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-mv]'), more = e.target.closest('[data-more]');
    if (more){ const id = more.dataset.more; openOpts.has(id) ? openOpts.delete(id) : openOpts.add(id); renderLayout(true); return; }
    if (!b || b.disabled) return;
    const id = b.closest('.sitem').dataset.id, sel = `[data-mv="${b.dataset.mv}"]`;
    if (step(b.closest('.sitem'), +b.dataset.mv)) refocus(list, id, sel);
  });
  list.addEventListener('change', e => {
    const el = e.target, item = el.closest('.sitem');
    if (el.matches('[data-vis]')){
      const key = list.id === 'sec-list' ? 'hidden' : 'pill_hidden', cur = new Set(D.layout[key]);
      el.checked ? cur.delete(item.dataset.id) : cur.add(item.dataset.id);
      save('layout.' + key, [...cur]);
    } else if (el.matches('[data-mod]')) save('modules.' + el.dataset.mod, el.checked);
    else if (el.matches('[data-ahead]')) save('layout.meeting_ahead', Math.max(0, Math.min(1440, +el.value || 0)));
    else if (el.matches('[data-bt]') || el.matches('[data-btshow]')){
      const name = el.dataset.bt || el.dataset.btshow, row = el.closest('.orow');
      api().bluetooth_set(name, row.querySelector('[data-bt]').value, row.querySelector('[data-btshow]').checked).then(() => setTimeout(load, 400));
    }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-useg] button');
    if (b) save('layout.usage_view', b.dataset.v);
  });
}

// ---------------- history (local logs, last 30 days) ----------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const dur = sec => { const m = Math.round(sec / 60); return m < 60 ? t('hist.minutes', {m}) : t('hist.hours', {h: Math.floor(m / 60), m: m % 60}); };
const tok = n => n >= 1e6 ? I18N.number(n / 1e6, 1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const sumTok = s => s.input === null ? null : s.input + s.output + s.cache_write;   // like the island: cache reads excluded
const money = c => '$' + I18N.number(c, 2);
async function loadHistory(){
  $('hist-sum').textContent = t('hist.loading'); $('hist-list').innerHTML = '';
  const r = await api().history();
  if (!r.ok){ $('hist-sum').textContent = t('hist.error'); return; }
  const groups = new Map();
  for (const s of r.sessions){ const k = s.project || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
  const total = (list, f) => list.reduce((a, s) => a + (f(s) || 0), 0);
  const known = (list, f) => list.some(s => f(s) !== null);
  const all = r.sessions;
  $('hist-sum').textContent = all.length ? t('hist.summary', {sessions: t('hist.sessions', {n: all.length}), projects: groups.size,
    duration: dur(total(all, s => s.duration)), tokens: tok(total(all, sumTok))}) : t('hist.empty');
  $('hist-list').hidden = !all.length;
  $('hist-list').innerHTML = [...groups.entries()].map(([project, list], gi) => {
    const icons = [...new Set(list.map(s => ICON[s.agent] || '•'))].join(' ');
    const parts = [t('hist.sessions', {n: list.length}), dur(total(list, s => s.duration))];
    if (known(list, sumTok)) parts.push(t('hist.tokens', {n: tok(total(list, sumTok))}));
    if (known(list, s => s.cost)) parts.push(money(total(list, s => s.cost)));
    const rows = list.map(s => `<div class="row"><span>${esc(ICON[s.agent] || '•')}</span><b>${esc(I18N.dateTime(s.start))}</b>
      <span>${esc(dur(s.duration))}</span>${sumTok(s) !== null ? `<span>${esc(t('hist.tokens', {n: tok(sumTok(s))}))}</span>` : ''}
      ${s.cost !== null ? `<span>${esc(money(s.cost))}</span>` : ''}<span>${esc(s.model)}</span></div>`).join('');
    return `<div class="row hproj" data-g="${gi}"><div class="ico">${esc(icons)}</div><div class="l">${project ? esc(project) : tx('hist.noProject')}
      <div class="d">${esc(parts.join(' · '))}</div></div></div><div class="hsess" id="hs-${gi}" hidden>${rows}</div>`;
  }).join('');
  document.querySelectorAll('.hproj').forEach(el => el.onclick = () => { const d = $('hs-' + el.dataset.g); d.hidden = !d.hidden; });
}

  gb.className = 'badge ' + (gc.status === 'ok' ? 'ok' : gc.status === 'error' ? 'err' : 'no');
  gb.textContent = gc.status === 'ok' && gc.account ? gc.account : t({signing_in: 'status.signingIn', ok: 'status.connected', error: 'status.error'}[gc.status] || 'status.notConnected');
  gbt.textContent = t(gc.status === 'ok' ? 'btn.signOut' : (gc.status === 'signing_in' ? 'btn.wait' : 'btn.signIn'));
  gbt.className = 'btn' + (gc.status === 'ok' || gc.status === 'signing_in' ? '' : ' primary');
  gbt.disabled = gc.status === 'signing_in';
  $('google-desc').textContent = gc.error ? gc.error : t('conn.google.desc');
  $('google-desc').style.color = gc.status === 'error' ? 'var(--red)' : '';
  $('google-secret-desc').textContent = t(gc.has_secret ? 'adf.secretSaved' : 'adf.secretDesc');
  renderLayout();
  renderConnector('outlook', s.connectors.outlook.enabled, 'conn.outlook.desc');
  renderConnector('ics', s.connectors.ics.enabled, 'conn.ics.desc');
  $('ics-url-desc').textContent = t(D.connectors.ics.has_secret ? 'conn.ics.urlSaved' : 'conn.ics.urlDesc');
  $('ics-remove').hidden = !D.connectors.ics.has_secret;
  renderConnector('adf', s.connectors.adf.enabled, 'conn.adf.desc');
  renderConnector('sql', s.connectors.sql.enabled, 'conn.sql.desc');
  const saved = JSON.stringify(s.connectors.sql.widgets || []);
  if (saved !== sqlSaved){ sqlSaved = saved; sqlWidgets = JSON.parse(saved); drawSql(); }
  else sqlResults();
  document.querySelectorAll('.adf-sp').forEach(el => el.style.display = s.connectors.adf.auth === 'sp' ? '' : 'none');
  $('adf-secret-desc').textContent = t(D.connectors.adf.has_secret ? 'adf.secretSaved' : 'adf.secretDesc');
  renderUpdate();
  renderMonitors();
  // refresh while something is in progress (Microsoft sign-in, update check or download)
  const busy = mc.status === 'signing_in' || (D.connectors.google || {}).status === 'signing_in' || UPD_BUSY.includes((D.update || {}).status);
  if (busy && !window.__poll) window.__poll = setInterval(load, 1500);
  else if (!busy && window.__poll){ clearInterval(window.__poll); window.__poll = null; }
}

window.addEventListener('pywebviewready', () => { bind(); load(); });
</script>
</body>
</html>
