name: Release

# Runs when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0).
# The tag must match VERSION in skerry/__init__.py and CHANGELOG.md must have a "## 1.2.0" section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Check the tag against the version
        id: ver
        shell: pwsh
        run: |
          $v = (python tools/release.py check-tag "${{ github.ref_name }}").Trim()
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing Skerry $v"

      - name: Release notes from CHANGELOG.md
        run: python tools/release.py notes ${{ steps.ver.outputs.version }} --out release-notes.md

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest

      - name: Build Skerry.exe and skerry-cli.exe (PyInstaller)
        run: python -m PyInstaller build/skerry.spec --noconfirm --distpath dist --workpath build/work

      # ---------------------------------------------------------------------------------------------------------
      # Code signing (disabled). Unsigned builds work, but SmartScreen and some antivirus products may warn.
      # Option A, SignPath (free for open source): needs a SignPath project and the SIGNPATH_API_TOKEN secret.
      # - name: Upload unsigned executables for signing
      #   id: unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-exe
      #     path: |
      #       dist/Skerry/Skerry.exe
      #       dist/Skerry/skerry-cli.exe
      # - name: Sign executables with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: "<your SignPath organization id>"
      #     project-slug: "skerry"
      #     signing-policy-slug: "release-signing"
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist/Skerry
      #
      # Option B, your own code-signing certificate (PFX as base64 in CERT_PFX_BASE64, password in CERT_PASSWORD):
      # - name: Sign executables with signtool
      #   shell: pwsh
      #   env:
      #     CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
      #     CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      #   run: |
      #     $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
      #     $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
      #     & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr "<timestamp URL of your CA>" /td SHA256 `
      #       dist\Skerry\Skerry.exe dist\Skerry\skerry-cli.exe
      #     Remove-Item $pfx
      # ---------------------------------------------------------------------------------------------------------

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Sign the installer too (same as above, before the checksums):
      # - name: Sign the installer
      #   shell: pwsh
      #   run: |
      #     & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr "<timestamp URL of your CA>" /td SHA256 `
      #       dist\Skerry-Setup-${{ steps.ver.outputs.version }}.exe

      - name: SHA256SUMS.txt
        run: python tools/release.py sums dist/Skerry-Setup-${{ steps.ver.outputs.version }}.exe --out dist/SHA256SUMS.txt

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $extra = @()
          if ("${{ steps.ver.outputs.prerelease }}" -eq "true") { $extra += "--prerelease" }
          gh release create "${{ github.ref_name }}" "dist/Skerry-Setup-$v.exe" "dist/SHA256SUMS.txt" `
            --title "Skerry $v" --notes-file release-notes.md --verify-tag @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
