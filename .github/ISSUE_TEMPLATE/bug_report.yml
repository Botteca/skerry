name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Do not report security vulnerabilities here**:
        see [SECURITY.md](https://github.com/fabrisimo/skerry/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Skerry
        2. Run a Claude Code session that asks for a permission
        3. ...
    validations:
      required: true
  - type: input
    id: skerry-version
    attributes:
      label: Skerry version
      description: Shown at the bottom of the expanded pill, or in Settings.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` and copy the edition, version and OS build.
      placeholder: "Windows 11 Pro 24H2, build 26100.2314"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Skerry?
      options:
        - Installer (Skerry-Setup-x.y.z.exe)
        - From source (run_dev.bat)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Claude Code
        - Codex
        - Permissions
        - Music / volume
        - Microphone / camera
        - Battery / Bluetooth
        - Timer / Pomodoro
        - File shelf
        - Usage
        - Microsoft 365
        - Window position / appearance
        - Installer / updates
        - Other
  - type: textarea
    id: log
    attributes:
      label: Diagnostics or log
      description: |
        Best: *Settings → About and logs → Copy diagnostics* and paste here (user paths, Bluetooth device names and
        email addresses are already hidden). Otherwise: Tray icon → Logs, or `%LOCALAPPDATA%\Skerry\logs\skerry.log`.
        Paste the lines around the problem. **Check them first** and remove anything private
        (project names, file paths, user names, meeting titles).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, monitor setup (number of screens, scaling), other overlay apps running, etc.
